<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<!--
  Source for docs/og-image.png. Rendered rather than drawn by hand so the card
  keeps the page's colours when they change.

      bash make-og.sh

  1200x630 is what the social cards crop to. Everything that has to survive a
  thumbnail sits in the middle half. Same ground, grid and type as the page,
  with the app icon: the notch panel drawn at its real proportions is too wide to
  sit beside the headline.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:#0e1012;color:#eceef0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(rgba(236,238,240,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(236,238,240,.05) 1px,transparent 1px);
    background-size:48px 48px;background-position:-1px -1px}
  .left{position:absolute;left:72px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
  .k{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#7d848c;margin-bottom:26px}
  h1{font-size:62px;line-height:1.04;font-weight:700;letter-spacing:-.03em}
  .sub{margin-top:24px;font-size:23px;line-height:1.45;color:#a3a9b0;max-width:21em}
  .foot{margin-top:30px;font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.06em;color:#7d848c}
  .foot b{color:#eceef0;font-weight:600}

  /* The icon is black artwork on a dark ground; without a hairline edge it
     reads as a missing image with the bars floating loose. */
  .icon{position:absolute;right:120px;top:50%;width:300px;height:300px;margin-top:-150px;border-radius:68px;
    box-shadow:0 0 0 1px rgba(255,255,255,.16),0 40px 90px rgba(0,0,0,.55)}
</style>
</head>
<body>
<div class="left">
  <div class="k">LUFSBar Pro · for macOS</div>
  <h1>Your plug-ins, on everything your Mac plays.</h1>
  <p class="sub">Up to five Audio Units on the system audio, and a BS.1770 meter reading what comes out.</p>
  <p class="foot">macOS 14.4+ &nbsp;·&nbsp; Apple silicon &amp; Intel &nbsp;·&nbsp; <b>$12</b></p>
</div>
<img class="icon" src="docs/icon.png" alt="">
</body>
</html>
